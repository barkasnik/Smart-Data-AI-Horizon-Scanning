[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smart-data-ai-radar"
version = "5.1.0"
description = "A visual, zero-cost-by-default UK Smart Data and AI horizon-scanning dashboard with weekly and monthly policy intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Smart Data AI Radar"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "trafilatura>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
smart-data-radar = "smart_data_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_data_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]

