editorial_principles:
  - Separate reported facts from source claims and source opinion.
  - Do not treat commercial thought leadership as neutral evidence by default.
  - Do not align with or oppose Raidiam; analyse its material as one perspective.
  - Prioritise material that changes policy, regulation, infrastructure, governance or real-world use cases.
  - Prefer primary sources for legal, regulatory and government developments.
  - Explain why an item matters to Smart Data and AI rather than merely summarising it.
  - Surface tensions: innovation vs safeguards, interoperability vs control, delegation vs consent, scale vs competition, AI capability vs accountability.

