name: Smart Data AI Radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar.yml'
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: Intelligence mode
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
  schedule:
    - cron: '10 7 * * 1'
    - cron: '30 7 1 * *'

permissions:
  contents: write

concurrency:
  group: smart-data-ai-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select mode
        id: cadence
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            MODE="$MANUAL_MODE"
          elif [ "$SCHEDULE" = "30 7 1 * *" ]; then
            MODE="monthly"
          else
            MODE="weekly"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected mode: $MODE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner and tests
        run: pip install -e '.[dev]'

      - name: Run automated tests
        run: pytest -q

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-instruct-v1

      - name: Start Ollama
        shell: bash
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b-instruct' }}
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Run radar
        env:
          SEARCH_BACKEND: google_news
          LLM_BACKEND: ollama
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b-instruct' }}
          RADAR_ANALYSE_LIMIT: ${{ steps.cadence.outputs.mode == 'weekly' && '8' || '12' }}
          RADAR_ANALYSIS_ATTEMPTS: '18'
          RADAR_CANDIDATE_LIMIT: '160'
          RADAR_RESULTS_PER_QUERY: '10'
          RADAR_MIN_SCORE: '30'
          RADAR_CONTENT_QUALITY: '45'
          RADAR_LLM_ARTICLE_CHARS: '3600'
          OLLAMA_TIMEOUT_SECONDS: '240'
          OLLAMA_NUM_CTX: '6144'
          OLLAMA_NUM_PREDICT: '1500'
          OLLAMA_NUM_PREDICT_RETRY: '2100'
        run: smart-data-radar run --mode "${{ steps.cadence.outputs.mode }}" --out-dir output

      - name: Quality check
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          mode = "${{ steps.cadence.outputs.mode }}"
          path = Path(f"output/{mode}-latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          items = data.get("articles", [])
          print(f"{mode.title()} ranked items: {len(items)}")

          if not items:
              raise SystemExit("No usable intelligence items were produced; previous briefing will be kept.")

          banned = ("/government/organisations/", "/government/collections/", "/about/", "/contact")
          domains = []
          for row in items:
              article = row.get("article", {})
              url = article.get("canonical_url", "")
              title = (article.get("title") or "").strip()
              if not title or not url:
                  raise SystemExit("Output item is missing a title or source link.")
              if any(fragment in url for fragment in banned):
                  raise SystemExit("Navigation/hub page leaked into briefing: " + url)
              domains.append(urlsplit(url).netloc.lower())

          if len(items) < 4 and mode == "weekly":
              print("Quality warning: thin week. Publishing the shorter evidence-led briefing; no filler added.")
          print("Source domains:", sorted(set(domains)))
          PY

      - name: Commit successful briefing
        shell: bash
        run: |
          MODE="${{ steps.cadence.outputs.mode }}"
          git config user.name 'smart-data-ai-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "output/${MODE}-latest.md" "output/${MODE}-latest.json" "output/${MODE}-latest.html"
          git diff --cached --quiet || git commit -m "chore: update ${MODE} Smart Data AI radar"
          git push
