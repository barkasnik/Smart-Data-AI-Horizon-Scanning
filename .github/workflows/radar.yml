name: Smart Data AI Radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Intelligence mode
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
  schedule:
    - cron: '10 7 * * 1'
    - cron: '30 7 1 * *'

permissions:
  contents: write

concurrency:
  group: smart-data-ai-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Select mode
        id: cadence
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then MODE="$MANUAL_MODE";
          elif [ "$SCHEDULE" = "30 7 1 * *" ]; then MODE="monthly";
          else MODE="weekly"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Install v5.3 balanced-source engine
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          files = {
            "src/smart_data_radar/quality.py": "",
            "src/smart_data_radar/cli.py": "",
            "config/sources.yml": "",
          }
          for name, payload in files.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(payload))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner
        run: pip install -e '.[dev]'

      - name: Commit engine upgrade first
        shell: bash
        run: |
          git config user.name 'smart-data-ai-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/smart_data_radar/cli.py src/smart_data_radar/quality.py config/sources.yml
          git diff --cached --quiet || git commit -m "feat: v5.3 balanced source selection"
          git push

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-1.5b-instruct-v1

      - name: Start Ollama
        shell: bash
        env:
          OLLAMA_MODEL: qwen2.5:1.5b-instruct
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Run radar
        env:
          SEARCH_BACKEND: google_news
          LLM_BACKEND: ollama
          OLLAMA_MODEL: qwen2.5:1.5b-instruct
          RADAR_MIN_WEEKLY_ITEMS: 7
          RADAR_ANALYSE_LIMIT: 10
          RADAR_ANALYSIS_ATTEMPTS: 24
          RADAR_CANDIDATE_LIMIT: 140
          RADAR_RESULTS_PER_QUERY: 12
          RADAR_MIN_SCORE: 28
          RADAR_LLM_ARTICLE_CHARS: 2200
          OLLAMA_TIMEOUT_SECONDS: 90
          OLLAMA_NUM_CTX: 3072
          OLLAMA_NUM_PREDICT: 560
        run: smart-data-radar run --mode "${{ steps.cadence.outputs.mode }}" --out-dir output

      - name: Quality check
        if: steps.cadence.outputs.mode == 'weekly'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("output/weekly-latest.json").read_text())
          items = data.get("articles", [])
          print("Weekly ranked items:", len(items))
          if len(items) < 7:
              raise SystemExit("Fewer than 7 usable items; keeping previous published briefing.")
          banned = ("/government/organisations/", "/government/collections/")
          for x in items:
              u = x.get("article", {}).get("canonical_url", "")
              if any(b in u for b in banned):
                  raise SystemExit("Banned navigation page in output: " + u)
          PY

      - name: Commit successful briefing
        shell: bash
        run: |
          git add output
          git diff --cached --quiet || git commit -m "update: ${{ steps.cadence.outputs.mode }} Smart Data AI briefing"
          git push
