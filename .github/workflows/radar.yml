name: Smart Data AI Radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Intelligence mode
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
  schedule:
    - cron: '10 7 * * 1'
    - cron: '30 7 1 * *'

permissions:
  contents: write

concurrency:
  group: smart-data-ai-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select weekly or monthly mode
        id: cadence
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            MODE="$MANUAL_MODE"
          elif [ "$SCHEDULE" = "30 7 1 * *" ]; then
            MODE="monthly"
          else
            MODE="weekly"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected mode: $MODE"

      - name: Apply v5.1 minimum-seven weekly upgrade
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          files = {
              "src/smart_data_radar/cli.py": "",
              "src/smart_data_radar/llm.py": "",
              "tests/test_weekly_minimum.py": "",
          }
          for path, payload in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(payload))

          pyproject = Path("pyproject.toml")
          if pyproject.exists():
              text = pyproject.read_text(encoding="utf-8")
              text = text.replace('version = "5.0.0"', 'version = "5.1.0"')
              pyproject.write_text(text, encoding="utf-8")

          Path(".gitignore").write_text(
              "__pycache__/\n*.py[cod]\n.pytest_cache/\nradar.db\n.env\n",
              encoding="utf-8",
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner
        run: pip install -e '.[dev]'

      - name: Run scanner tests
        run: pytest -q tests

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-1.5b-instruct-v1

      - name: Start Ollama and load free local model
        shell: bash
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:1.5b-instruct' }}
        run: |
          set -euo pipefail
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$OLLAMA_MODEL"

      - name: Run horizon scanner
        env:
          SEARCH_BACKEND: google_news
          LLM_BACKEND: ollama
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:1.5b-instruct' }}
          RADAR_MIN_WEEKLY_ITEMS: '7'
          RADAR_ANALYSE_LIMIT: '10'
          RADAR_CANDIDATE_LIMIT: '80'
          RADAR_RESULTS_PER_QUERY: '10'
          RADAR_FALLBACK_SCORE: '20'
          RADAR_LLM_ARTICLE_CHARS: '4500'
          OLLAMA_TIMEOUT_SECONDS: '90'
          OLLAMA_NUM_CTX: '4096'
          OLLAMA_NUM_PREDICT: '950'
        run: smart-data-radar run --mode "${{ steps.cadence.outputs.mode }}" --out-dir output

      - name: Verify weekly minimum when enough candidates exist
        if: steps.cadence.outputs.mode == 'weekly'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/weekly-latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          n = len(data.get('articles', []))
          print(f'Weekly briefing contains {n} ranked items')
          if n < 7:
              print('WARNING: fewer than 7 fresh rankable items were retained. Check scanner log for candidate availability.')
          PY

      - name: Clean runtime files
        shell: bash
        run: |
          rm -rf __pycache__ src/smart_data_radar/__pycache__ tests/__pycache__ .pytest_cache
          rm -f radar.db

      - name: Commit v5.1 upgrade and briefing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'smart-data-ai-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "feat: guarantee resilient 7-item weekly radar"
          git push
